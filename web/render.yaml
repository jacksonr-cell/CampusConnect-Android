services:
  - type: web
    name: campusconnect-web
    runtime: static
    rootDir: web
    buildCommand: echo "Checking CampusConnect static site"
    staticPublishPath: .
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
