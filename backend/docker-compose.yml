version: '3.8'

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image          : postgres:16-alpine
    container_name : campusconnect_postgres
    restart        : unless-stopped
    environment:
      POSTGRES_DB      : ${DATABASE_NAME:-campusconnect}
      POSTGRES_USER    : ${DATABASE_USERNAME:-campusconnect}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-campusconnect_dev}
    ports  : ['${DATABASE_PORT:-5432}:5432']
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test    : ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-campusconnect}']
      interval: 10s
      timeout : 5s
      retries : 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image          : redis:7-alpine
    container_name : campusconnect_redis
    restart        : unless-stopped
    command        : redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports  : ['${REDIS_PORT:-6379}:6379']
    volumes: [redis_data:/data]
    healthcheck:
      test    : ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout : 5s
      retries : 5

  # ── API (development) ──────────────────────────────────────────────────────
  api:
    build:
      context   : .
      dockerfile: Dockerfile
      target    : development
    container_name: campusconnect_api
    restart       : unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis   : { condition: service_healthy }
    environment:
      NODE_ENV          : development
      PORT              : 3000
      DATABASE_HOST     : postgres
      DATABASE_PORT     : 5432
      DATABASE_USERNAME : ${DATABASE_USERNAME:-campusconnect}
      DATABASE_PASSWORD : ${DATABASE_PASSWORD:-campusconnect_dev}
      DATABASE_NAME     : ${DATABASE_NAME:-campusconnect}
      REDIS_HOST        : redis
      REDIS_PORT        : 6379
      REDIS_PASSWORD    : ${REDIS_PASSWORD:-}
      JWT_ACCESS_SECRET : ${JWT_ACCESS_SECRET:-change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_in_prod_too}
      SMTP_HOST         : ${SMTP_HOST:-}
      SMTP_PORT         : ${SMTP_PORT:-587}
      SMTP_USER         : ${SMTP_USER:-}
      SMTP_PASS         : ${SMTP_PASS:-}
      EMAIL_FROM        : ${EMAIL_FROM:-noreply@campusconnect.app}
      APP_URL           : ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS      : ${CORS_ORIGINS:-http://localhost:3000}
    ports  : ['${PORT:-3000}:3000']
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    command: npm run start:dev

  # ── Redis Commander (dev UI) ───────────────────────────────────────────────
  redis-commander:
    image         : rediscommander/redis-commander:latest
    container_name: campusconnect_redis_ui
    restart       : unless-stopped
    depends_on    : [redis]
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-}
    ports: ['8081:8081']
    profiles: ['tools']   # only starts with: docker-compose --profile tools up

volumes:
  postgres_data:
  redis_data:
