name: Android CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'backend/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'backend/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble Android debug app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Run Android JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  backend:
    name: Build and lint backend copies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [backend, backend-v2]
    defaults:
      run:
        working-directory: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.backend }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
