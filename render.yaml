# Production blueprint. Review the paid resource plans before creating a Render Blueprint.
# This file does not provision resources by itself; deploying it creates billable services.
services:
  - type: keyvalue
    name: campusconnect-redis
    plan: 256mb
    region: singapore
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: campusconnect-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 1c-2g
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health/ping
    preDeployCommand: npm run migration:run:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: TYPEORM_RUN_MIGRATIONS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: campusconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: campusconnect-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_PROVIDER
        value: s3
      - key: AWS_S3_REGION
        value: auto
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_ENDPOINT
        sync: false
      - key: AWS_S3_CDN_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: campusconnect-db
    databaseName: campusconnect
    user: campusconnect
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
