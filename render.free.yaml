# Temporary no-cost demo stack. Render Free Postgres expires after 30 days,
# Free web services spin down when idle, and local uploads are ephemeral.
services:
  - type: keyvalue
    name: campusconnect-demo-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: campusconnect-demo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: https://campusconnect-web-em5v.onrender.com
      - key: APP_URL
        value: https://campusconnect-web-em5v.onrender.com
      - key: TYPEORM_RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: campusconnect-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: campusconnect-demo-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_BASE_URL
        value: https://campusconnect-demo-api.onrender.com/uploads
      - key: EMAIL_ENABLED
        value: "false"

databases:
  - name: campusconnect-demo-db
    databaseName: campusconnect
    user: campusconnect
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
